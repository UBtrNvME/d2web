<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d2editor</title>
<link rel="stylesheet" href="style.css">
<body>
<header>
  <strong class="brand">d2editor</strong>
  <div class="tools" id="visual-tools" role="toolbar" aria-label="Visual editing" hidden>
    <button type="button" id="connect" aria-pressed="false" title="Connect the selected object to the next one you click"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><path d="M7 12h10m-3-3 3 3-3 3"/><circle cx="19" cy="12" r="2"/></svg>Connect</button>
  </div>
  <div class="tools" role="toolbar" aria-label="History">
    <button type="button" id="undo" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" id="redo" title="Redo (Shift+Ctrl/Cmd+Z)" aria-label="Redo"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <div class="tools" role="toolbar" aria-label="View">
    <button type="button" id="zoom-out" title="Zoom out (-)" aria-label="Zoom out"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button type="button" id="zoom" title="Reset to 100% (Shift+0)" aria-label="Zoom level, reset to 100%">100%</button>
    <button type="button" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
    <button type="button" id="fit" title="Fit the diagram (Shift+1)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit</button>
  </div>
  <div class="document">
    <label>Theme <select id="theme"></select></label>
    <label title="D2's hand-drawn look"><input type="checkbox" id="sketch"> Sketch</label>
    <label>Layout <select id="layout"><option value="tala">TALA</option><option value="dagre">dagre</option><option value="elk">ELK</option></select></label>
    <label>Board <select id="board"><option value="">root</option></select></label>
    <label class="file" title="Open a .d2 file"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>Open<input type="file" id="open" accept=".d2,text/plain"></label>
    <button type="button" id="download" title="Download the D2 text"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-4-4 4 4 4-4M5 20h14"/></svg>Download</button>
    <button type="button" id="share" title="Copy a link that opens this diagram (D2's ?script= encoding)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>Share</button>
  </div>
</header>
<aside class="source-pane" aria-label="Source">
  <div class="pane-title"><span>main.d2</span><span class="hint">D2 source</span></div>
  <div class="source">
    <div id="src"></div>
  </div>
  <div id="status" role="status"></div>
</aside>
<main id="canvas" aria-label="Diagram canvas: click or Tab to an object to select it, Escape to clear; drag or scroll to pan, Ctrl/Cmd+scroll to zoom">
  <div id="grid" aria-hidden="true"></div>
  <div id="host"></div>
  <div id="toolbar" role="toolbar" aria-label="Selection" hidden>
    <label class="swatch" data-tool="fill" title="Fill"><input type="color" aria-label="Fill colour" value="#ffffff"></label>
    <label class="swatch" data-tool="stroke" title="Stroke"><input type="color" aria-label="Stroke colour" value="#000000"></label>
    <button type="button" id="tool-delete" title="Delete (Backspace)" aria-label="Delete"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2m-6 0 1 12h6l1-12"/></svg></button>
  </div>
</main>
<aside id="sidebar" aria-label="Side bar">
<details id="outline" class="pane" open><summary>Outline</summary><p class="empty">No objects to show.</p></details>
<details id="inspector-pane" class="pane" open>
<summary>Inspector</summary>
<div class="pane-body">
<p class="empty" id="no-selection">Select an object to edit its properties.</p>
<section id="inspector" aria-label="Selected object" hidden>
  <h2 id="selected"></h2>
  <form id="props">
    <section data-section="element">
      <h3>Element</h3>
      <label data-keyword="stroke"><span>Stroke</span> <span class="color"><input name="stroke" autocomplete="off" placeholder="D2's default" spellcheck="false"><input type="color" data-for="stroke" tabindex="-1" aria-label="Pick stroke colour"></span></label>
      <div class="fields" data-fields="element"></div>
    </section>
    <section data-section="node">
      <h3>Node</h3>
      <div id="type" class="segmented" role="group" aria-label="Type" hidden></div>
      <label data-keyword="fill"><span>Fill</span> <span class="color"><input name="fill" autocomplete="off" placeholder="D2's default" spellcheck="false"><input type="color" data-for="fill" tabindex="-1" aria-label="Pick fill colour"></span></label>
      <div class="fields" data-fields="node"></div>
    </section>
    <section data-section="shape">
      <h3>Shape</h3>
      <div class="fields" data-fields="shape"></div>
    </section>
    <section data-section="image">
      <h3>Image</h3>
      <div class="fields" data-fields="image"></div>
    </section>
    <section data-section="sequence">
      <h3>Sequence</h3>
      <div class="fields" data-fields="sequence"></div>
    </section>
    <section data-section="grid">
      <h3>Grid</h3>
      <div class="fields" data-fields="grid"></div>
    </section>
    <section data-section="table">
      <h3>Table</h3>
      <div class="fields" data-fields="table"></div>
      <div class="rows"></div>
    </section>
    <section data-section="class">
      <h3>Class</h3>
      <div class="fields" data-fields="class"></div>
      <div class="rows"></div>
    </section>
    <section data-section="text">
      <h3>Text</h3>
      <div id="text-tag" class="segmented" role="group" aria-label="Text format"></div>
      <label data-keyword="content"><span>Content</span> <textarea name="content" rows="6" spellcheck="false"></textarea></label>
      <label data-keyword="language"><span>Language</span> <input name="language" list="languages" autocomplete="off" spellcheck="false" placeholder="Search languages"><datalist id="languages"></datalist></label>
      <div class="fields" data-fields="text"></div>
    </section>
    <section data-section="edge">
      <h3>Edge</h3>
      <div id="endpoints" class="row" hidden></div>
      <div class="fields" data-fields="edge"></div>
    </section>
    <label data-keyword="label" id="label-field"><span>Label</span> <input name="label" autocomplete="off"></label>
    <label data-keyword="shape" id="shape-field"><span>Shape</span> <select name="shape"></select></label>
    <label data-keyword="icon" id="icon-field"><span>Icon</span> <input name="icon" autocomplete="off" placeholder="none" spellcheck="false"></label>
  </form>
  <form id="rename">
    <h3>Name</h3>
    <div class="row"><input name="name" autocomplete="off" required aria-label="Rename to"><button>Rename</button></div>
  </form>
  <button type="button" id="delete" class="danger">Delete</button>
</section>
</div>
</details>
</aside>
<dialog id="confirm">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <menu><button value="cancel" autofocus>Cancel</button> <button value="ok" id="confirm-ok">Change type</button></menu>
  </form>
</dialog>
<dialog id="unchecked">
  <form method="dialog">
    <h2>D2 cannot apply this edit as a small change</h2>
    <p id="reason"></p>
    <ul id="labels"></ul>
    <p>D2's formatted text with the edit:</p>
    <pre id="formatted"></pre>
    <menu><button value="cancel" autofocus>Cancel</button> <button value="use" id="use">Use formatted text</button></menu>
  </form>
</dialog>
<script type="module" src="main.js"></script>
</body>
</html>
