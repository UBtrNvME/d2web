<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d2web demo</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: minmax(280px, 34%) 1fr; height: 100vh; }
  aside { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-right: 1px solid #8884; overflow: auto; }
  textarea { flex: 1; min-height: 200px; font: 13px ui-monospace, monospace; tab-size: 2; }
  label { display: flex; gap: 6px; align-items: center; }
  /* The canvas is demo chrome, not part of d2web: an infinite, dotted surface the board sits on. Its colour is D2's own scene background for the
     chosen theme (set in paintCanvas); the dots are a translucent ink picked for contrast with it. Pan and zoom are the demo's, in #world. */
  main { position: relative; overflow: hidden; touch-action: none; cursor: grab; background-color: Canvas; }
  /* The dot grid is a sibling layer, not styling on <main>: its custom properties change on every pan frame, and on an ancestor of the board
     they would restyle every element in it each time. */
  #grid { position: absolute; inset: 0; pointer-events: none; --dot-rgb: 128 128 128; --dot-a: .22; --dot-r: .5px;
    background-image: radial-gradient(circle, rgb(var(--dot-rgb) / var(--dot-a)) var(--dot-r), transparent calc(var(--dot-r) + .4px)); background-size: var(--gap, 20px) var(--gap, 20px); background-position: var(--px, 0) var(--py, 0); }
  main.panning { cursor: grabbing; user-select: none; }
  #world { position: absolute; z-index: 0; left: 0; top: 0; transform-origin: 0 0; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center; cursor: default; }
  .zoom button { min-width: 32px; height: 32px; font: inherit; cursor: pointer; }
  .zoom output { min-width: 3.5em; text-align: center; font-size: 12px; opacity: .8; }
  #status { font-size: 12px; opacity: .7; min-height: 1.4em; }
  #errors { color: #c0392b; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid #8884; } main { height: 70vh; } }
</style>
<aside>
  <label>Example <select id="example"></select></label>
  <textarea id="src" spellcheck="false" aria-label="D2 source"></textarea>
  <label>Theme <select id="theme"></select></label>
  <label>Layout <select id="layout"><option value="tala">TALA</option><option value="dagre">dagre</option><option value="elk">ELK</option></select></label>
  <label><input type="checkbox" id="sketch"> Sketch</label>
  <label>Board <select id="board"><option value="">root</option></select></label>
  <div id="status" role="status"></div>
  <div id="errors"></div>
</aside>
<main aria-label="Diagram canvas: drag empty space to pan, Ctrl or Cmd with the wheel (or pinch) to zoom">
  <div id="grid" aria-hidden="true"></div>
  <div id="world"><div id="host"></div></div>
  <div class="zoom" role="group" aria-label="Canvas zoom">
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <output id="zoom-level" aria-live="off">100%</output>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" id="zoom-fit" aria-label="Fit diagram to canvas">Fit</button>
  </div>
</main>

const examples = {

};
const themes = [[0, 'Neutral default'], [1, 'Neutral grey'], [3, 'Flagship Terrastruct'], [4, 'Cool classics'], [5, 'Mixed berry blue'], [6, 'Grape soda'], [7, 'Aubergine'], [8, 'Colorblind clear'], [100, 'Vanilla Nitro Cola'], [101, 'Orange creamsicle'], [102, 'Shirley temple'], [103, 'Earth tones'], [104, 'Everglade green'], [105, 'Buttered toast'], [200, 'Dark Mauve'], [201, 'Dark Flagship Terrastruct'], [300, 'Terminal'], [301, 'Terminal Grayscale'], [302, 'Origami'], [303, 'C4']];
const $ = id => document.getElementById(id);
for (const name of Object.keys(examples)) $('example').add(new Option(name));
// Auto follows the system scheme with D2's own default light and dark themes. The page chrome follows the system on its own (color-scheme);
// the theme is only what D2 paints, so a manual choice never changes the chrome and the canvas always takes the scene's background.
const dark = matchMedia('(prefers-color-scheme: dark)');
$('theme').add(new Option('Auto (follow system)', 'auto'));
for (const [id, name] of themes) $('theme').add(new Option(`${name} (${id})`, id));
const themeId = () => ($('theme').value === 'auto' ? (dark.matches ? 200 : 0) : +$('theme').value);
// D2 paints the board background as the scene's `root:background` rectangle; the canvas reuses that paint rather than inventing a colour.
const backgroundOf = scene => {
  const node = (scene?.Root?.Children ?? []).find(c => c.ID === 'root:background');
  const color = node?.Primitive?.Fill?.$ === 'SolidPaint' ? node.Primitive.Fill.Color : '';
  return /^rgba\(\d+,\d+,\d+,[\d.]+\)$/.test(color) ? color : '';
};

// Images (spec 0010): D2 names a remote image by its link. The page fetches the links the source uses (only from the origin named here, no credentials) and hands
// the bytes to the compiler, as `d2 --bundle` does; a link that cannot be fetched (another origin, CORS, offline) is shown as a link instead of D2's placeholder.
const client = createClient({ spawn: spawnWorker(), images: { mode: 'bundle', resolve: fetchImages({ allow: ['https://icons.terrastruct.com'] }), fallback: 'link' } });
const view = mount($('host'));
let last, revision = 0;

async function run() {
  $('status').textContent = 'compiling…';
  const started = performance.now();
  try {
    last = await client.compile({
      revision: ++revision, files: { 'main.d2': $('src').value }, entry: 'main.d2', boards: 'all',
      render: { themeId: themeId(), sketch: $('sketch').checked, pad: 40, scale: 1, center: false },
      layout: $('layout').value,
    });
  } catch (error) { if (error.name !== 'SupersededError') $('status').textContent = String(error); return; }
  if (last.error) { $('errors').textContent = last.error.diagnostics?.map(d => `${d.range?.start?.line + 1 ?? '?'}: ${d.message}`).join('\n') || last.error.message; $('status').textContent = 'error'; return; }
  $('errors').textContent = last.diagnostics.map(d => d.message).join('\n');
  const unresolved = new Set(last.diagnostics.filter(d => d.code === 'image-unresolved').map(d => d.message)).size;
  const chosen = $('board').value;
  $('board').replaceChildren(...last.boards.map(b => new Option(b.path || 'root', b.path)));
  $('board').value = last.boards.some(b => b.path === chosen) ? chosen : '';
  await view.update(last, $('board').value);
  paintCanvas();
  if (fitNext) { fitNext = false; fit(); }
  $('status').textContent = `${last.boards.length} board(s), compiled in ${Math.round(performance.now() - started)} ms (${last.millis ?? '?'} ms in D2)${unresolved ? `; ${unresolved} image link(s) could not be fetched and are shown as links` : ''}`;
}
let timer;
const later = () => { clearTimeout(timer); timer = setTimeout(run, 300); };
$('src').addEventListener('input', later);
for (const id of ['theme', 'layout', 'sketch']) $(id).addEventListener('change', run);
const sheet = new CSSStyleSheet();
function paintCanvas() {
  const board = last?.boards.find(b => b.path === $('board').value), color = backgroundOf(board?.scene), canvas = document.querySelector('main');
  canvas.style.backgroundColor = color;
  // Dots are black or white ink at low alpha, whichever contrasts with the scene's background; with no solid background the system text colour is used.
  const [r, g, b] = color ? color.match(/\d+/g).map(Number) : [];
  // D2 paints the board background as an opaque rectangle, which would hide the dots and make the board read as a picture pasted on the canvas.
  // The canvas already carries that same solid colour, so the rectangle is hidden and the dots show through; the colour D2 chose is unchanged.
  // A gradient or pattern background has no single colour to hand to the canvas, so there the rectangle stays.
  const root = $('host').shadowRoot;
  if (root && !root.adoptedStyleSheets.includes(sheet)) root.adoptedStyleSheets = [...root.adoptedStyleSheets, sheet];
  sheet.replaceSync(color ? '[data-id="root:background"] { display: none; }' : '');
  $('grid').style.setProperty('--dot-rgb', color ? ((0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.5 ? '0 0 0' : '255 255 255') : '');
}

// The infinite canvas (demo only): a pan/zoom transform on #world and a dot grid that moves and scales with it. Dragging empty space (or any
// touch) pans; Ctrl/Cmd+wheel and pinch zoom around the pointer; the plain wheel pans. Drags that start on a D2 object are left alone, so
// text selection, clicks, links and focus inside the board behave as before.
const canvas = document.querySelector('main'), world = $('world');
const camera = { x: 0, y: 0, k: 1 };
const MIN = 0.1, MAX = 4;
const grid = $('grid');
let shownLevel = '', queued = false;
// Input handlers ask for a frame; the camera is applied once per animation frame however many wheel or pointer events arrived.
const scheduleCamera = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; applyCamera(); }); } };
function applyCamera() {
  world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.k})`;
  // Quiet by design (React Flow and tldraw as reference): 1 px dots every 20 px, scaling with zoom, fading out when zoomed far out instead of thickening.
  const gap = 20 * camera.k;
  grid.style.setProperty('--dot-a', `${(0.22 * Math.min(1, Math.max(0, (camera.k - 0.25) / 0.35))).toFixed(3)}`);
  grid.style.setProperty('--dot-r', `${Math.min(1.5, Math.max(0.5, 0.5 * camera.k)).toFixed(2)}px`);
  grid.style.setProperty('--gap', `${gap}px`);
  grid.style.setProperty('--px', `${camera.x % gap}px`);
  grid.style.setProperty('--py', `${camera.y % gap}px`);
  const level = `${Math.round(camera.k * 100)}%`;
  if (level !== shownLevel) { shownLevel = level; $('zoom-level').textContent = level; } // a text change forces layout, so only when it changes
}
function zoomAt(factor, cx, cy) {
  const k = Math.min(MAX, Math.max(MIN, camera.k * factor)), ratio = k / camera.k;
  camera.x = cx - (cx - camera.x) * ratio; camera.y = cy - (cy - camera.y) * ratio; camera.k = k;
  scheduleCamera();
}
const centre = () => { const r = canvas.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
function fit() {
  const r = canvas.getBoundingClientRect(), w = $('host').offsetWidth, h = $('host').offsetHeight;
  if (!w || !h) return;
  camera.k = Math.min(1, Math.max(MIN, Math.min((r.width - 80) / w, (r.height - 80) / h)));
  camera.x = (r.width - w * camera.k) / 2; camera.y = (r.height - h * camera.k) / 2;
  applyCamera();
}
$('zoom-in').addEventListener('click', () => zoomAt(1.25, ...centre()));
$('zoom-out').addEventListener('click', () => zoomAt(0.8, ...centre()));
$('zoom-fit').addEventListener('click', fit);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-Math.max(-60, Math.min(60, e.deltaY * (e.deltaMode ? 5 : 1))) * 0.01), e.clientX - r.left, e.clientY - r.top); // trackpad pinch arrives as ctrl+wheel
  else { camera.x -= e.deltaX; camera.y -= e.deltaY; scheduleCamera(); }
}, { passive: false });
const pointers = new Map();
let moved = false, pinch = null, panning = false;
const onObject = e => e.composedPath().some(el => (el.dataset?.id !== undefined && !['root', 'root:background'].includes(el.dataset.id)) || el.closest?.('.zoom'));
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || (e.pointerType !== 'touch' && onObject(e))) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
});
canvas.addEventListener('pointermove', e => {
  const last = pointers.get(e.pointerId);
  if (!last) return;
  const dx = e.clientX - last[0], dy = e.clientY - last[1];
  if (!moved && Math.hypot(dx, dy) < 4 && pointers.size === 1) return;
  if (!moved) { moved = true; panning = true; canvas.classList.add('panning'); canvas.setPointerCapture(e.pointerId); }
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = canvas.getBoundingClientRect();
    zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d;
  } else if (pointers.size === 1) { camera.x += dx; camera.y += dy; scheduleCamera(); }
});
const release = e => { pointers.delete(e.pointerId); pinch = null; if (!pointers.size) { canvas.classList.remove('panning'); setTimeout(() => { panning = false; }, 0); } };
canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);
canvas.addEventListener('click', e => { if (panning) { e.stopPropagation(); e.preventDefault(); } }, true); // a pan is not a click on whatever it ended over
let fitNext = true; // fit on load and when an example is picked, not on every recompile, so editing does not move the camera
applyCamera();
dark.addEventListener('change', () => { if ($('theme').value === 'auto') run(); });
$('board').addEventListener('change', () => last && view.update(last, $('board').value).then(paintCanvas));
$('example').addEventListener('change', () => { $('src').value = examples[$('example').value]; fitNext = true; run(); });
$('example').dispatchEvent(new Event('change'));
</script>
