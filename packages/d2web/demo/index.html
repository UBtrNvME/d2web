<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d2web demo</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: minmax(280px, 34%) 1fr; height: 100vh; }
  aside { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-right: 1px solid #8884; overflow: auto; }
  textarea { flex: 1; min-height: 200px; font: 13px ui-monospace, monospace; tab-size: 2; }
  label { display: flex; gap: 6px; align-items: center; }
  /* The canvas is demo chrome, not part of d2web: an infinite, dotted surface the board sits on. Its colour is D2's own scene background for the
     chosen theme (set in paintCanvas); the dots are a translucent ink picked for contrast with it. Pan and zoom are the demo's, in #world. */
  main { position: relative; overflow: hidden; touch-action: none; cursor: grab; background-color: Canvas; }
  /* The dot grid is a sibling layer, not styling on <main>: its custom properties change on every pan frame, and on an ancestor of the board
     they would restyle every element in it each time. */
  #grid { position: absolute; inset: 0; pointer-events: none; --dot-rgb: 128 128 128; --dot-a: .22; --dot-r: .5px;
    background-image: radial-gradient(circle, rgb(var(--dot-rgb) / var(--dot-a)) var(--dot-r), transparent calc(var(--dot-r) + .4px)); background-size: var(--gap, 20px) var(--gap, 20px); background-position: var(--px, 0) var(--py, 0); }
  main.panning { cursor: grabbing; user-select: none; }
  #world { position: absolute; z-index: 0; left: 0; top: 0; transform-origin: 0 0; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center; cursor: default; }
  .zoom button { min-width: 32px; height: 32px; font: inherit; cursor: pointer; }
  .zoom output { min-width: 3.5em; text-align: center; font-size: 12px; opacity: .8; }
  #status { font-size: 12px; opacity: .7; min-height: 1.4em; }
  #errors { color: #c0392b; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; height: auto; } aside { border-right: 0; border-bottom: 1px solid #8884; } main { height: 70vh; } }
</style>
<aside>
  <label>Example <select id="example"></select></label>
  <textarea id="src" spellcheck="false" aria-label="D2 source"></textarea>
  <label>Theme <select id="theme"></select></label>
  <label>Layout <select id="layout"><option value="tala">TALA</option><option value="dagre">dagre</option><option value="elk">ELK</option></select></label>
  <label><input type="checkbox" id="sketch"> Sketch</label>
  <label>Board <select id="board"><option value="">root</option></select></label>
  <div id="status" role="status"></div>
  <div id="errors"></div>
</aside>
<main aria-label="Diagram canvas: drag empty space to pan, Ctrl or Cmd with the wheel (or pinch) to zoom">
  <div id="grid" aria-hidden="true"></div>
  <div id="world"><div id="host"></div></div>
  <div class="zoom" role="group" aria-label="Canvas zoom">
    <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
    <output id="zoom-level" aria-live="off">100%</output>
    <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
    <button type="button" id="zoom-fit" aria-label="Fit diagram to canvas">Fit</button>
  </div>
</main>
<script type="module">
import { createClient, spawnWorker, mount } from './index.js';

const examples = {
  'Shapes and connections': 'direction: right\ndb: Database {shape: cylinder}\napi: API {style.fill: "#fff4cc"}\nclient: Browser {shape: person}\nclient -> api: request\napi -> db: query\ndb -> api: rows {style.stroke-dash: 4}\n',
  'Containers': 'cloud: Cloud {\n  web: Web\n  app: App\n  web -> app\n}\nuser: User {shape: person}\nuser -> cloud.web: https\n',
  'Sequence diagram': 'shape: sequence_diagram\nalice -> bob: hello\nbob -> alice: hi\nalice -> bob: bye\n',
  'Grid': 'grid-rows: 2\ngrid-columns: 3\na\nb\nc\nd\ne\nf\n',
  'SQL table and class': 'users: {shape: sql_table\n  id: int {constraint: primary_key}\n  name: varchar(100)\n}\nPolygon: {shape: class\n  +area(): float\n}\nusers.id -> Polygon\n',
  'Animated, links and tooltips': 'a -> b {style.animated: true}\nb: Docs {link: https://d2lang.com; tooltip: Opens the D2 docs}\nc: Lift {style.animated: true}\n',
  'Markdown, code, LaTeX': 'md: |md\n# Title\nSome **bold** text\n|\ncode: |`go\nfunc main() {}\n`|\nmath: |`latex\n\\frac{a}{b} + \\sqrt{c}\n`|\n',
  'SQL foreign keys': 'orders: {shape: sql_table\n  id: int {constraint: primary_key}\n  user_id: int {constraint: foreign_key}\n  total: decimal\n}\nusers: {shape: sql_table\n  id: int {constraint: primary_key}\n  email: varchar {constraint: unique}\n}\norders.user_id -> users.id\n',
  'Shapes gallery': 'grid-columns: 4\na: Rectangle {shape: rectangle}\nb: Circle {shape: circle}\nc: Diamond {shape: diamond}\nd: Hexagon {shape: hexagon}\ne: Cloud {shape: cloud}\nf: Cylinder {shape: cylinder}\ng: Document {shape: document}\nh: Queue {shape: queue}\ni: Step {shape: step}\nj: Package {shape: package}\nk: Callout {shape: callout}\nl: Person {shape: person}\n',
  'Classes and variables': 'vars: {primary: "#1d4ed8"}\nclasses: {\n  service: {style.fill: ${primary}; style.font-color: white; style.border-radius: 8}\n}\nauth: Auth {class: service}\nbilling: Billing {class: service}\ndb: Postgres {shape: cylinder}\nauth -> db\nbilling -> db\n',
  'Globs': '*.style.fill: "#dbeafe"\n(* -> *)[*].style.stroke: "#1d4ed8"\na\nb\nc\na -> b -> c\n',
  'Arrowheads and labels': 'a -> b: {source-arrowhead.label: 1; target-arrowhead.label: "*"}\nb -> c: two way {source-arrowhead: {shape: diamond}; target-arrowhead: {shape: arrow}}\nc -> d: dashed {style.stroke-dash: 4}\nd -> a: animated {style.animated: true}\n',
  'Nested containers': 'cloud: Cloud {\n  region: eu-west {\n    api: API\n    worker: Worker\n    api -> worker: jobs\n  }\n  store: Storage {shape: cylinder}\n  region.worker -> store\n}\nuser: User {shape: person}\nuser -> cloud.region.api: https\n',
  'Multi-line labels': 'a: "Line one\\nLine two\\nLine three"\nb: Single\na -> b: "edge label\\non two lines"\n',
  'Layers (boards)': 'a -> b\nlayers: {\n  detail: {\n    x -> y\n  }\n}\n',
  // `@{name}` is D2's `${name}` substitution; it is converted when the example is built so JavaScript does not interpolate it.
  'd2web in the D2 ecosystem': String.raw`direction: down

classes: {
  part: {style: {border-radius: 8; stroke-width: 2; font-size: 18}}
  stage: {style: {border-radius: 8; font-size: 18}}
  later: {style: {stroke-dash: 4; stroke-width: 2; border-radius: 8; opacity: 0.85; font-size: 18}}
  call: {style: {stroke-width: 2; font-size: 16}}
  feed: {style: {stroke-dash: 3; opacity: 0.85; font-size: 16}}
  tier: {style: {font-size: 22; border-radius: 12}}
  badge: {icon.near: top-left; label.near: center-center; height: 80}
}

title: |md
  # d2web in the D2 ecosystem
  D2 text in, native DOM out. D2 decides; d2web paints.
| {near: top-center}

host: Host page {
  class: tier
  author: Author {class: badge; shape: rectangle; icon: @{ic_author}; icon.near: center-left; width: 170; style.font-size: 18}
  demo: "Demo app\nGitHub Pages" {class: [part; badge]; icon: @{ic_laptop}}
  editor: "d2editor\n(future)" {class: later}
  react: "React binding\n(future)" {class: [later; badge]; icon: @{ic_react}}
  author -> demo: writes D2 {class: call}
}

pkg: "@d2web package (TypeScript)" {
  class: tier
  tooltip: "Framework independent: no React, no component library, no application state"
  icon: @{ic_ts}
  icon.near: top-left
  label.near: top-center
  client: "Client\ncreateClient\nlatest request wins" {class: part}
  worker: "Worker\none compile at a time\nrevision echoed" {class: part}
  mount: "Mount\nshadow root · typed events\nsetNodeContent" {class: part; tooltip: "hover, click and focus carry D2 identity: board path and object ID"}
  painter: "Painter\npaintScene(scene)\nHTML first, SVG where needed" {class: [part; badge]; icon: @{ic_html}}
  fonts: "Fonts\nconsumer-listed faces" {class: badge; shape: document; icon: @{ic_css}; style.font-size: 18}
  client -> worker: postMessage {class: call}
  client -> mount: "update(result, board)" {class: call}
  mount -> painter: paintScene {class: call}
  fonts -> mount: "@font-face" {class: feed}
}

wasm: "d2web.wasm (Go, pinned D2 v0.9.0)" {
  class: tier
  icon: @{ic_go}
  icon.near: top-left
  label.near: top-center
  direction: down
  front: Parse and compile {
    direction: right
    style.font-size: 18
    parser: "d2parser\ntext → AST" {class: stage}
    ir: "d2ir\nimports · classes\nglobs · vars" {class: stage}
    compiler: "d2compiler\nAST → d2graph" {class: stage}
    parser -> ir -> compiler: {class: call}
  }
  back: Layout and scene {
    direction: right
    style.font-size: 18
    engines: "Layout engines" {
      direction: right
      style.font-size: 16
      tala: TALA {shape: hexagon}
      dagre: dagre {shape: hexagon}
      elk: ELK {shape: hexagon}
    }
    target: "d2target.Diagram\npositions · routes · styles" {class: stage}
    build: "d2scenebuild\nthemes · sketch\nfonts · assets" {class: stage}
    scene: "Scene JSON\nassociation · diagnostics" {shape: page; style.font-size: 18}
    engines -> target -> build -> scene: {class: call}
  }
  front.compiler -> back.engines: d2graph {class: call}
}

dom: "Native DOM\nHTML + SVG in a shadow root" {shape: cloud; style.font-size: 18}

reference: Reference and quality {
  class: tier
  cli: "d2 CLI (TALA)\nnative SVG" {class: badge; shape: document; icon: @{ic_go}; style.font-size: 18}
  e2e: "Playwright conformance\nwithin 5% raster of native" {class: badge; shape: diamond; icon: @{ic_chrome}; style.font-size: 16}
  ci: "mise run check\ncheck:browser · Actions" {class: badge; shape: queue; icon: @{ic_github}; style.font-size: 18}
  cli -> e2e: SVG {class: call}
  e2e -> ci: gates {class: call}
}

host.demo -> pkg.client: "compile({files, entry,\nlayout, render})" {class: call}
host.editor -> pkg.client: {class: feed}
host.react -> pkg.mount: {class: feed}
pkg.worker -> wasm.front.parser: run {class: call}
wasm.back.scene -> pkg.worker: "result: boards + fonts" {class: call}
pkg.painter -> dom: markup {class: call}
dom -> reference.e2e: screenshot {class: feed}

const dark = matchMedia('(prefers-color-scheme: dark)');

const backgroundOf = scene => {

  const chosen = $('board').value;
  $('board').replaceChildren(...last.boards.map(b => new Option(b.path || 'root', b.path)));
  $('board').value = last.boards.some(b => b.path === chosen) ? chosen : '';

canvas.addEventListener('click', e => { if (panning) { e.stopPropagation(); e.preventDefault(); } }, true); // a pan is not a click on whatever it ended over
let fitNext = true; // fit on load and when an example is picked, not on every recompile, so editing does not move the camera
applyCamera();
dark.addEventListener('change', () => { if ($('theme').value === 'auto') run(); });
$('board').addEventListener('change', () => last && view.update(last, $('board').value).then(paintCanvas));
$('example').addEventListener('change', () => { $('src').value = examples[$('example').value]; fitNext = true; run(); });
$('example').dispatchEvent(new Event('change'));
</script>
